name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            data_separator: ";"
            build_mode: --onefile
          - platform: macos
            os: macos-latest
            data_separator: ":"
            build_mode: --onedir
#           - platform: linux
#             os: ubuntu-24.04
#             data_separator: ":"
#             build_mode: --onedir

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

#       - name: Install Linux desktop build dependencies
#         if: matrix.platform == 'linux'
#         run: |
#           sudo apt-get update
#           sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build application bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name AlphaEngine
          ${{ matrix.build_mode }}
          --collect-all webview
          --add-data "app/templates${{ matrix.data_separator }}app/templates"
          --add-data "rules${{ matrix.data_separator }}rules"
          desktop.py

      - name: Verify the packaged bundle has no node_modules
        run: >-
          python -c "from pathlib import Path; root=Path('dist');
          assert not any(item.name == 'node_modules' for item in root.rglob('node_modules'))"

      - name: Smoke-test packaged app on Windows
        if: matrix.platform == 'windows'
        run: dist/AlphaEngine.exe --smoke-test

      - name: Smoke-test packaged app on macOS
        if: matrix.platform == 'macos'
        run: dist/AlphaEngine.app/Contents/MacOS/AlphaEngine --smoke-test

#       - name: Smoke-test packaged app on Linux
#         if: matrix.platform == 'linux'
#         run: dist/AlphaEngine/AlphaEngine --smoke-test

      - name: Package Windows executable
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist/AlphaEngine.exe artifacts/AlphaEngine-windows-x64.exe
        shell: pwsh

      - name: Package macOS disk image
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          hdiutil create -volname "Alpha Engine" -srcfolder dist/AlphaEngine.app -ov -format UDZO artifacts/AlphaEngine-macos.dmg

